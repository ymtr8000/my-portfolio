<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>My Portfolio</h1>
            <p>Welcome to my creative space</p>
        </div>
    </header>

    <main class="container">
        <!-- メインビジュアル -->
        <section class="hero">
            <img src="images/top.jpg" alt="Top Image" class="hero-img">
        </section>

        <!-- プロフィールセクション -->
        <section class="profile">
            <h2>About Me</h2>
            <p>ここにあなたの簡単な自己紹介や、活動内容を記述してください。テキストエディタで自由に書き換えることができます。</p>
        </section>

        <!-- ポートフォリオの各ページへのリンク -->
        <section class="projects">
            <h2>Projects</h2>
            <div class="grid">
                <!-- Megane ページへのリンク -->
                <a href="megane/index.html" class="card">
                    <h3>Megane</h3>
                    <p>メガネに関する作品やコレクションのページを見る</p>
                </a>
                <!-- Portrait ページへのリンク -->
                <a href="portrait/index.html" class="card">
                    <h3>Portrait</h3>
                    <p>ポートレート作品のギャラリーページを見る</p>
                </a>
                <!-- Snap ページへのリンク -->
                <a href="snap/index.html" class="card">
                    <h3>Snap</h3>
                    <p>日常のスナップ写真や作品のページを見る</p>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
